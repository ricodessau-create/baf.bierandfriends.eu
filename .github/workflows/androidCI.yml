name: Android Release CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify google-services.json
        run: |
          python3 -c "import json; json.load(open('app/google-services.json')); print('✅ OK')"

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          mkdir -p app/keystore
          echo "$RELEASE_KEYSTORE" | base64 -d > app/keystore/release.keystore
          echo "Keystore Größe: $(wc -c < app/keystore/release.keystore) bytes"

      - name: Verify Keystore Alias
        run: |
          keytool -list \
            -keystore app/keystore/release.keystore \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -v 2>&1 | grep -E "Alias|Eintragstyp|Entry type" || true

      - name: Build Release
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BierAndFriends-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30
